name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # AI 리뷰는 Draft PR이나 봇 PR에서는 실행하지 않음
    if: >
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.user.login, 'bot') &&
      !contains(github.event.pull_request.user.login, '[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: AI Review with Claude (OAuth)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          timeout_minutes: "10"
          direct_prompt: |
            이 PR의 코드 변경사항을 리뷰해주세요. 한국어로 간결하게 답변하고, 다음 항목에 집중해주세요:

            1. 🐛 버그 가능성
            2. 🔒 보안 이슈
            3. ⚡ 성능 문제
            4. ✨ 코드 품질 개선점

            각 항목에 해당사항이 없으면 생략하고, 있으면 구체적인 파일 위치와 개선 방안을 제시해주세요.
            전반적으로 잘 작성된 코드라면 칭찬도 해주세요.

      - name: Skip Notice
        if: steps.changed-files.outputs.any_changed != 'true'
        run: |
          echo "No TypeScript/JavaScript files changed, skipping AI review"
