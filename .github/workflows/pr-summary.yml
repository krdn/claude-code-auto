name: AI PR Summary

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  summarize:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.user.login, 'bot') &&
      !contains(github.event.pull_request.user.login, '[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Summary Exists
        id: check-summary
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const hasSummary = body.includes('## 🤖 AI Summary') || body.includes('## 📋 Changes Summary');
            core.setOutput('exists', hasSummary.toString());

      - name: AI Summary with Claude (OAuth)
        if: steps.check-summary.outputs.exists != 'true'
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          timeout_minutes: "5"
          direct_prompt: |
            이 PR의 변경사항을 요약해주세요. 한국어로 작성하고 다음 형식을 따라주세요:

            ## 🤖 AI Summary

            ### 주요 변경사항
            - (변경사항 1)
            - (변경사항 2)

            ### 영향 범위
            - (영향받는 기능이나 모듈)

            ### 리뷰 포인트
            - (리뷰어가 특히 확인해야 할 부분)

            간결하게 3-5문장으로 핵심만 요약해주세요.
